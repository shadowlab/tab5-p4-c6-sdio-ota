name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  # Prebuilt ESP32-C6 co-processor image (ESP-Hosted v3.0.9). It only has to exist to compile: the app embeds it.
  C6_FIRMWARE_URL: https://esphome.github.io/esp-hosted-firmware/v3.0.9/network_adapter_esp32c6.bin
  C6_FIRMWARE_SHA256: 80e85881783840ff7c533878b679b9a6d72c426d0696e2f15ee064ca8b6c12db

jobs:
  build:
    name: Build (ESP-IDF ${{ matrix.idf }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        idf: ["v6.1"]
    container: espressif/idf:${{ matrix.idf }}
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the C6 firmware image
        run: |
          curl -fsSL --retry 3 -o firmware/network_adapter.bin "$C6_FIRMWARE_URL"
          echo "$(sha256sum firmware/network_adapter.bin | cut -d' ' -f1)  firmware/network_adapter.bin"
          if ! echo "$C6_FIRMWARE_SHA256  firmware/network_adapter.bin" | sha256sum -c -; then
            echo "::warning::The published image differs from the checksum in the README; building with it anyway"
          fi

      - name: Build
        run: |
          . $IDF_PATH/export.sh
          idf.py set-target esp32p4
          idf.py build

      - name: Image sizes
        run: |
          . $IDF_PATH/export.sh
          idf.py size

      - uses: actions/upload-artifact@v4
        with:
          name: tab5_c6_ota-idf-${{ matrix.idf }}
          path: |
            build/tab5_c6_ota.bin
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
            build/flasher_args.json

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tab5_c6_ota-idf-v6.1
          path: artifact

      - name: Collect the files
        run: |
          mkdir release
          cp artifact/tab5_c6_ota.bin artifact/flasher_args.json release/
          cp artifact/bootloader/bootloader.bin artifact/partition_table/partition-table.bin release/
          # The flash command, with the offsets the build itself reports
          python3 - <<'PY' > release/flash.txt
          import json
          a = json.load(open("release/flasher_args.json"))
          files = " ".join(f"{off} {path.split('/')[-1]}" for off, path in sorted(a["flash_files"].items(), key=lambda kv: int(kv[0], 16)))
          print(f"esptool --chip esp32p4 --baud 460800 write_flash {files}")
          PY
          cat release/flash.txt
          cd release && sha256sum *.bin > SHA256SUMS

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ startsWith(github.ref_name, 'v0.') }}
          generate_release_notes: true
          files: release/*
          body: |
            Updates the firmware of the ESP32-C6 co-processor of the M5Stack Tab5 over SDIO. Flash it on its own, wait for
            `[PASS]` in the serial log, then flash your own firmware over it. See the README.

            **Not run on a Tab5 yet.** Built with ESP-IDF 6.1. The factory C6 firmware (ESP-Hosted 1.4.1) may not be able to talk to this
            3.x host, and the C6 has no rollback.

            The application embeds the ESP32-C6 ESP-Hosted v3.0.9 image published by ESPHome
            (https://esphome.github.io/esp-hosted-firmware/), which is built from Espressif's Apache-2.0 esp-hosted-mcu.

            Flash command: see `flash.txt` (run it from the folder with the downloaded files, add `--port <port>`). Checksums in `SHA256SUMS`.
